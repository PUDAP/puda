services:
  # Response streams are created by the provisioner
  # (infra/nats/jetstream/setup_streams.sh). On an unprovisioned broker the
  # logger creates missing ones with the protocol 1.0 settings; it never
  # updates or deletes existing streams.
  reductstore-logger:
    build: .
    image: ghcr.io/pudap/reductstore-logger:latest
    container_name: reductstore-logger
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PUDA_NATS_CA: "${PUDA_NATS_CA:+/run/puda-ca/ca.pem}"
      PUDA_E2E_KEY_FILE: "${PUDA_E2E_KEY_FILE:+/run/puda-key/e2e.key}"
    volumes:
      # Unset variables mount /dev/null as an unused placeholder for plaintext mode.
      - type: bind
        source: ${PUDA_NATS_CA:-/dev/null}
        target: /run/puda-ca/ca.pem
        read_only: true
        bind:
          create_host_path: false
      # The SDK updates this file in place, so key rotations persist to the host.
      - type: bind
        source: ${PUDA_E2E_KEY_FILE:-/dev/null}
        target: /run/puda-key/e2e.key
        bind:
          create_host_path: false
