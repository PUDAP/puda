[project]
name = "reductstore-logger"
version = "1.0.0"
description = "Logger service that listens to NATS command/response/telemetry streams and logs to ReductStore (PUDA Edge Protocol 1.0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "puda==0.1.0rc1",
    "nats-py>=2.17.0",
    "python-dotenv>=1.2.1",
    "reduct-py>=1.17,<2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools]
py-modules = ["main", "reduct_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
