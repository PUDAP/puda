# PUDA site NTP server.
# Sync this host to public/campus NTP, then serve time to edge machines.

# Upstream. Replace with campus NTP when you have it:
#   server ntp.example.edu iburst
pool ntp.ubuntu.com iburst maxsources 4

driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
pidfile /run/chrony/chronyd.pid

makestep 1.0 3
rtcsync

# If upstream is unreachable, keep serving the last known time so the fleet
# stays on one clock.
local stratum 10

# Lab LAN, Docker bridges, and Tailscale CGNAT.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
allow 100.64.0.0/10
allow 127.0.0.1/32
allow ::1/128

# chronyc from docker exec / healthcheck only.
bindcmdaddress 127.0.0.1
cmdallow 127.0.0.1
