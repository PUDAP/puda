# Client connection port
port: 4222

# HTTP monitoring port
http_port: 8222

# Maximum simultaneous edge/client connections
max_connections: 200000

# Unique server name (resolved from environment variable in compose.yml)
server_name: $SERVER_NAME

# mqtt config
mqtt {
  port: 1883
}

# Dynamically advertises the correct host port via Tailscale
client_advertise: "$HOST_IP:$EXTERNAL_PORT"

# Max payload size for messages
max_payload: 64MB

# JETSTREAM CONFIGURATION
# https://docs.nats.io/running-a-nats-service/configuration/resource_management
jetstream {
    store_dir: "/data/jetstream"
    max_mem: 4G
    max_file: 10G

    request_queue_limit: 1000

    limits {
        # NATS 2.15+ caps each stream at 1000 consumers by default; PUDA needs one
        # COMMAND_QUEUE and one COMMAND_IMMEDIATE consumer per machine. -1 = unlimited
        # (pre-2.15 behaviour). Remove this line before downgrading to 2.14.
        default_max_consumers: -1
    }
}
