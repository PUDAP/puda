port: 4222

http: 127.0.0.1:8222

max_connections: 200000

server_name: $SERVER_NAME

tls {
  cert_file: "/etc/nats/certs/server.pem"
  key_file: "/etc/nats/certs/server.key"
  ca_file: "/etc/nats/certs/ca.pem"
  timeout: 2
}

mqtt {
  port: 8883
  tls {
    cert_file: "/etc/nats/certs/server.pem"
    key_file: "/etc/nats/certs/server.key"
    ca_file: "/etc/nats/certs/ca.pem"
    timeout: 2
  }
}

max_payload: 64MB

jetstream {
  store_dir: "/data/jetstream"
  max_mem: 4G
  max_file: 10G
  request_queue_limit: 1000

  limits {
    max_ha_assets: 250000
  }
}

cluster {
  name: "puda"
  listen: "0.0.0.0:6222"
  tls {
    cert_file: "/etc/nats/certs/server.pem"
    key_file: "/etc/nats/certs/server.key"
    ca_file: "/etc/nats/certs/ca.pem"
    timeout: 2
    verify: true
  }
  routes: [
    $NATS1_ROUTE,
    $NATS2_ROUTE,
    $NATS3_ROUTE
  ]
}
