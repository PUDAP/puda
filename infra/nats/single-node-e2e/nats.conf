# Client connection port. TLS is configured below; clients use tls://.
port: 4222

# Monitoring stays on the container loopback and is not published.
http: 127.0.0.1:8222

max_connections: 200000

server_name: $SERVER_NAME

tls {
  cert_file: "/etc/nats/certs/server.pem"
  key_file: "/etc/nats/certs/server.key"
  ca_file: "/etc/nats/certs/ca.pem"
  timeout: 2
}

# Plain MQTT is disabled. MQTT clients use TLS on 8883.
mqtt {
  port: 8883
  tls {
    cert_file: "/etc/nats/certs/server.pem"
    key_file: "/etc/nats/certs/server.key"
    ca_file: "/etc/nats/certs/ca.pem"
    timeout: 2
  }
}

max_payload: 64MB

jetstream {
  store_dir: "/data/jetstream"
  max_mem: 4G
  max_file: 10G
  request_queue_limit: 1000
}
