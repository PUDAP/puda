# Client connection port
port: 4222

# HTTP monitoring port
http_port: 8222

# Maximum simultaneous edge/client connections on this node
max_connections: 200000

# Unique server name injected by compose.yml
server_name: $SERVER_NAME

mqtt {
  port: 1883
}

max_payload: 64MB

jetstream {
    store_dir: "/data/jetstream"
    max_mem: 4G
    max_file: 10G
    request_queue_limit: 1000

    # R3 streams and consumers are HA assets. Sized for ~200k PUDA consumers.
    limits {
      max_ha_assets: 250000
    }
}

cluster {
    name: "puda"
    listen: "0.0.0.0:6222"
    routes: [
        $NATS1_ROUTE,
        $NATS2_ROUTE,
        $NATS3_ROUTE
    ]
}
